    .n{fill:#20242c;font-size:16px;font-weight:700;}
    .d{fill:#5a554d;font-size:11.5px;}
    .ar{stroke:#8a8378;stroke-width:1.4;fill:none;marker-end:url(#ah);}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
